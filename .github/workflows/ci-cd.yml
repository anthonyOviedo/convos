name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client deps
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

      - name: Install server deps
        run: cd server && npm ci

  deploy:
    name: Deploy to producción
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        env:
          SSH_CONN: ${{ secrets.SSH_CONN }}
        run: |
          # Formato del secret: user:pass@host:port
          USER="${SSH_CONN%%:*}"
          REST="${SSH_CONN#*:}"
          PASS="${REST%%@*}"
          HOSTPORT="${REST#*@}"
          HOST="${HOSTPORT%%:*}"
          PORT="${HOSTPORT##*:}"

          sudo apt-get install -y sshpass -q

          sshpass -p "$PASS" ssh -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" \
            'set -e
             cd /home/tony/Desktop/convos
             git pull origin main
             bash build.sh
             podman compose -f podman-compose.yml down --remove-orphans || true
             podman compose -f podman-compose.yml up -d
             echo "✓ conVos deployado — $(git rev-parse --short HEAD)"'
